<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbharat Online - Registration</title>
  <!-- Added Bootstrap CSS for responsive design -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
  <div class="main-container">
    <div class="form-card">
      <!-- Added Bootstrap-based header section with logo -->
      <div class="form-header mb-0 pb-0">
        <img src="/static/navbharat_logo.png" alt="Navbharat Online" class="logo-img">
        <h3>Register Yourself to Stay Updated</h3>
        <p>Receive an Additional Discount of Upto 5%*</p>
      </div>
      <p class="text-end text-white pe-2 m-0" style="background: var(--brand-green); font-size: smaller;"><b>*T&C Apply</b></p>

      <!-- Form section with Bootstrap grid and form classes -->
      <div class="form-body" id="form-step1">
        <form id="otpForm">
          <div class="mb-3">
            <label for="name" class="form-label">Full Name *</label>
            <input type="text" class="form-control" id="name" placeholder="Enter your full name" required>
          </div>

          <div class="mb-4">
            <label for="mobile" class="form-label">Mobile Number *</label>
            <input type="text" class="form-control" id="mobile" placeholder="Enter 10-digit mobile number"
              maxlength="10" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email (Optional)</label>
            <input type="email" class="form-control" id="email" placeholder="Enter your email">
          </div>

          <button type="button" id="sendOtp" class="btn btn-brand w-100">Send OTP</button>
        </form>
      </div>

      <!-- Success message section using Bootstrap classes -->
      <div class="success-section d-none" id="successMessage">
        <div class="success-icon">
          <svg viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <h3>Success!</h3>
        <p>Your discount QR code has been sent to your WhatsApp number.</p>
      </div>
    </div>
  </div>

  <!-- Bootstrap Modal for OTP verification -->
  <div class="modal fade otp-modal" id="otpModal" tabindex="-1" aria-labelledby="otpModalLabel" aria-hidden="true"
    data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="otpModalLabel">Verify OTP</h5>
        </div>
        <div class="modal-body">
          <p class="otp-subtitle">Enter the 6-digit code sent to your WhatsApp</p>

          <div class="otp-inputs">
            <input type="text" class="otp-input" maxlength="1" data-index="0">
            <input type="text" class="otp-input" maxlength="1" data-index="1">
            <input type="text" class="otp-input" maxlength="1" data-index="2">
            <input type="text" class="otp-input" maxlength="1" data-index="3">
            <input type="text" class="otp-input" maxlength="1" data-index="4">
            <input type="text" class="otp-input" maxlength="1" data-index="5">
          </div>

          <button type="button" id="verifyOtp" class="btn btn-brand w-100">Verify OTP</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Added Bootstrap JS for modal functionality -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/api_caller.js"></script>
  <script src="/static/js/form.js"></script>
</body>

</html>
